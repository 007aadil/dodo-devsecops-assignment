name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write

jobs:
  security-scan:

    name: Security Scan

    runs-on: ubuntu-latest

    steps:

      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4


      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install bandit semgrep


      # Bandit SAST Scan
      - name: Run Bandit
        run: |
          bandit -r app


      # Semgrep SAST Scan
      - name: Run Semgrep
        run: |
          semgrep scan \
          --config=auto \
          app/


      # Gitleaks Secret Scan
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml


      # Install Trivy
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release apt-transport-https

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
          gpg --dearmor | \
          sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
          sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

          trivy --version


      # Trivy Filesystem Scan
      - name: Run Trivy Filesystem Scan
        run: |
          trivy fs \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          .


      # Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # Login GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # Install Cosign
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"


      # Build local image for scanning
      - name: Build Docker Image
        run: |
          docker build \
          -t ledger-api:scan \
          ./app


      # Trivy Container Image Scan
      - name: Run Trivy Image Scan
        run: |
          trivy image \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          ledger-api:scan


      # Build and Push Image to GHCR
      - name: Build and Push Docker Image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ledger-api:latest
            ghcr.io/${{ github.repository_owner }}/ledger-api:${{ github.sha }}


      # Generate SLSA Provenance
      - name: Generate Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/ledger-api
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true


      # Cosign Keyless Signing
      - name: Sign Container Image
        env:
          COSIGN_EXPERIMENTAL: "true"

        run: |
          cosign sign --yes \
          ghcr.io/${{ github.repository_owner }}/ledger-api:${{ github.sha }}


      # Verify Cosign Signature
      - name: Verify Container Signature
        run: |
          cosign verify \
          ghcr.io/${{ github.repository_owner }}/ledger-api:${{ github.sha }} \
          --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/.*" \
          --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
